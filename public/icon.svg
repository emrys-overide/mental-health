<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="shieldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="40%" stop-color="#f59e0b" />
      <stop offset="80%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0" />
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="10" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Subtle Ambient Glow -->
  <circle cx="256" cy="256" r="190" fill="url(#glowGrad)" />

  <!-- Shield of Faith Outline -->
  <path d="M 256,80 C 330,80 395,115 395,185 C 395,300 256,420 256,420 C 256,420 117,300 117,185 C 117,115 182,80 256,80 Z" 
        fill="#0b1329" 
        stroke="url(#shieldBorder)" 
        stroke-width="10" 
        stroke-linejoin="round" />

  <!-- Inner Shield Glow -->
  <path d="M 256,98 C 318,98 375,128 375,188 C 375,286 256,392 256,392 C 256,392 137,286 137,188 C 137,128 194,98 256,98 Z" 
        fill="#0f172a" 
        opacity="0.9" />

  <!-- Sacred Flame of Freedom & Victory -->
  <path d="M 256,150 
           C 278,205 315,225 315,275 
           C 315,315 290,345 256,345 
           C 222,345 197,315 197,275 
           C 197,238 220,215 235,190 
           C 240,215 250,225 255,225 
           C 260,225 264,220 264,210 
           C 264,185 256,165 256,150 Z" 
        fill="url(#flameGrad)" 
        filter="url(#glow)" />

  <!-- Inner Core Flame -->
  <path d="M 256,220 
           C 270,250 286,268 286,290 
           C 286,312 272,328 256,328 
           C 240,328 226,312 226,290 
           C 226,270 240,252 256,220 Z" 
        fill="#ffffff" 
        opacity="0.95" />

  <!-- Small cross at heart of flame -->
  <rect x="253" y="270" width="6" height="32" rx="3" fill="#d97706" />
  <rect x="244" y="278" width="24" height="6" rx="3" fill="#d97706" />
</svg>
